name = "market-platform"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# ===================== Database اصلی مارکت =====================
[[d1_databases]]
binding = "DB"
database_name = "market-db"
database_id = "d1c071e4-9d02-475f-be27-263a80e2f6f2"

# ===================== دیتابیس مشترک کاتالوگ/کاربر/پلن =====================
[[d1_databases]]
binding = "SHARED_CATALOG"
database_name = "shared-catalog"
database_id = "800d4ba6-cfcf-46dd-8408-26cb86cc44ac"

# ===================== Variables (غیر حساس) =====================
[vars]
SMS_PROVIDER = "mock"
SMS_SENDER = ""
SMS_TEMPLATE_OTP = "otp"
PAYMENT_PROVIDER = "mock"
PAYMENT_CALLBACK_URL = ""
PAYMENT_SANDBOX = "true"

# ===================== Secrets =====================
# npx wrangler secret put JWT_SECRET
# npx wrangler secret put SMS_API_KEY
# npx wrangler secret put PAYMENT_MERCHANT_ID
