name = "market-platform"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# ===================== Database =====================
[[d1_databases]]
binding = "DB"
database_name = "market-db"
database_id = "00000000-0000-0000-0000-000000000000"  # بعد از ساخت دیتابیس واقعی جایگزین شود

# ===================== Variables (غیر حساس) =====================
[vars]
# SMS
SMS_PROVIDER = "mock"              # بعداً: kavenegar | smsir | faraz
SMS_SENDER = ""
SMS_TEMPLATE_OTP = "otp"

# Payment
PAYMENT_PROVIDER = "mock"          # بعداً: zarinpal | idpay
PAYMENT_CALLBACK_URL = ""
PAYMENT_SANDBOX = "true"

# ===================== Secrets (حساس - با دستور secret گذاشته شوند) =====================
# برای تنظیم کلیدهای واقعی از دستورات زیر استفاده کنید:
#
# npx wrangler secret put SMS_API_KEY
# npx wrangler secret put PAYMENT_MERCHANT_ID
# npx wrangler secret put JWT_SECRET
#
# هرگز کلید واقعی را داخل این فایل نگذارید.
